# Render 一键部署配置（免费版）
# 关联本仓库后，Render 会按此文件拉起一个 Web 服务。
services:
  - type: web
    name: domestic-shop
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: PAYMENT_MODE
        value: mock   # 真实收款请改为 wechat / alipay / all，并配置对应密钥（见 README）
